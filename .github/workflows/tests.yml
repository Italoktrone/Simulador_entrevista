name: Calidad y API

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      LLM_PROVIDER: ollama
      LLM_ALLOW_EXTERNAL_API: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Instalar dependencias
        run: python -m pip install --no-compile -r requirements-dev.txt
      - name: Verificar contratos, pruebas, Ruff, Bandit y recuperación
        run: python -B -m scripts.check_project
      - name: Conservar evidencia técnica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}
          path: reports/
